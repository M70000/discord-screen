services:
  - type: web
    name: discord-screen-relay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: OBS_WEBHOOK_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: ANNOUNCEMENT_CHANNEL_NAME
        value: telamento
